<style>
:root{--coral:#ff7a68;--teal:#2f80c4;--skylight:#aee2ff;--mustard:#ffc233;--cream:#f4faff;--text-dark:#2c3e50;}
*{margin:0;padding:0;box-sizing:border-box;}html{scroll-behavior:smooth;}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--cream);color:var(--text-dark);line-height:1.6;overflow-x:hidden;}
nav.brandbar{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:700px;display:flex;align-items:center;justify-content:center;gap:12px;padding:12px 20px;background:rgba(255,255,255,.78);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,.3);border-radius:18px;box-shadow:0 8px 32px rgba(0,0,0,.08);z-index:9999;transition:.3s ease;}
nav.brandbar.scrolled{background:rgba(255,255,255,.92);box-shadow:0 12px 40px rgba(0,0,0,.15);}
nav.brandbar .drone-icon{font-size:1.6rem;display:inline-block;animation:hover-bob 3s ease-in-out infinite;}
nav.brandbar .brand-text{text-align:left;line-height:1.1;}
nav.brandbar .brand-text .en{font-weight:800;font-size:1.15rem;letter-spacing:0.5px;}
nav.brandbar .brand-text .en span{color:var(--coral);}
nav.brandbar .brand-text .en span.s2{color:var(--teal);}
nav.brandbar .brand-text .th{font-size:0.8rem;color:#888;}
@keyframes hover-bob{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-4px) rotate(-6deg);}}
.hero-brand{text-align:center;}
.hero-brand .en{font-size:3rem;font-weight:800;letter-spacing:1px;text-shadow:0 3px 8px rgba(0,0,0,.6);}
.hero-brand .en span{color:var(--coral);}
.hero-brand .en .s2{color:var(--skylight);}
.hero-brand .th{font-size:1.3rem;font-weight:600;margin-top:.3rem;text-shadow:0 2px 6px rgba(0,0,0,.6);}
header.hero{position:relative;text-align:center;color:#fff;overflow:hidden;background:linear-gradient(180deg,#aee2ff 0%,#6ec3f4 45%,#2f80c4 100%);min-height:420px;display:flex;align-items:flex-end;justify-content:center;padding-top:90px;}
header.hero .overlay{position:relative;z-index:2;width:100%;background:linear-gradient(to top,rgba(10,40,70,0.75),transparent 90%);padding:2rem 1rem;}
header.hero p{font-size:1.1rem;margin-top:0.5rem;text-shadow:0 1px 4px rgba(0,0,0,0.5);opacity:0;animation:fade-up 0.9s ease-out 0.6s forwards;}
@keyframes fade-up{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
.cloud-shape{position:absolute;background:#fff;border-radius:50px;opacity:0.85;filter:drop-shadow(0 6px 8px rgba(0,0,0,0.08));pointer-events:none;}
.cloud-shape::before,.cloud-shape::after{content:"";position:absolute;background:#fff;border-radius:50%;}
.cloud-shape.c1{width:120px;height:40px;top:8%;left:-130px;animation:drift 22s linear infinite;}
